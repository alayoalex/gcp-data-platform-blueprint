[project]
name = "faro-governance"
version = "0.1.0"
description = "Motor de gobierno de datos como codigo: naming, privacidad y contratos."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
llm = ["google-cloud-aiplatform>=1.60"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
faro = "faro_governance.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["faro_governance*"]

[tool.setuptools.package-data]
faro_governance = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# El lint se configura en ruff.toml, en la raiz del repositorio.
